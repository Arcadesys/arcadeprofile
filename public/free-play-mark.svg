<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100" role="img" aria-label="Free Play Publishing mark">
  <defs>
    <linearGradient id="ic-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#ff3cac"/>
    </linearGradient>
    <linearGradient id="ic-slot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d98a"/>
      <stop offset="60%" stop-color="#e8c777"/>
      <stop offset="100%" stop-color="#c89a3e"/>
    </linearGradient>
    <filter id="ic-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ic-slot-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#ic-slot-glow)">
    <rect x="70" y="10" width="22" height="80" rx="11" fill="#0a0a14" stroke="url(#ic-slot)" stroke-width="2.5"/>
    <rect x="80" y="22" width="2" height="56" rx="1" fill="#000"/>
    <rect x="80" y="22" width="1" height="56" rx="0.5" fill="#c89a3e" opacity="0.55"/>
  </g>

  <path d="M 81,28 A 22,22 0 1,0 81,72 L 81,28 Z" fill="#000"/>
  <g filter="url(#ic-glow)">
    <path d="M 81,28 A 22,22 0 1,0 81,72 A 17,17 0 1,1 81,28 Z" fill="none" stroke="url(#ic-coin)" stroke-width="2.8" opacity="0.95"/>
    <path d="M 79,41 A 9,9 0 1,0 79,59 Z" fill="#ff8a00" opacity="0.78"/>
  </g>
</svg>
