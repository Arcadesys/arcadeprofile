name: Publish scheduled posts
on:
  schedule:
    # Every 15 minutes. GitHub Actions schedules can be delayed by 10+ minutes
    # under load, so a 9:00 AM post may actually publish a few minutes late —
    # but it will publish the same hour rather than waiting until the next day.
    - cron: '*/15 * * * *'
  workflow_dispatch:        # adds a manual "Run workflow" button.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish-scheduled endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_TARGET_URL}/api/posts/publish-scheduled"
