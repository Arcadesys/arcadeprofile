name: Publish scheduled posts
on:
  schedule:
    # Every 15 minutes. GitHub Actions schedules can be delayed by 10+ minutes
    # under load, so a 9:00 AM post may actually publish a few minutes late —
    # but it will publish the same hour rather than waiting until the next day.
    #
    # Flip due posts from `scheduled` to public, then send the daily post email
    # through Postmark. ActiveCampaign is used only as the contact/list source.
    - cron: '*/15 * * * *'
  workflow_dispatch:        # adds a manual "Run workflow" button.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish-scheduled endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          set -o pipefail

          if [ -z "${CRON_TARGET_URL}" ]; then
            echo "::error::CRON_TARGET_URL secret is not set"
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET secret is not set"
            exit 1
          fi

          ENDPOINT="${CRON_TARGET_URL}/api/posts/publish-scheduled"
          # Only the host is safe to print — never the secret or full token.
          HOST=$(printf '%s' "${CRON_TARGET_URL}" | sed -E 's#^https?://##' | cut -d/ -f1)
          echo "Started at:   $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Target host:  ${HOST}"
          echo "Endpoint:     /api/posts/publish-scheduled"

          BODY_FILE="$(mktemp)"
          META_FILE="$(mktemp)"

          # `-w` captures status + timing so we can distinguish a transport
          # failure from the publish update itself failing.
          # `-o` writes the body separately so we can echo it even when the
          # response is empty or non-JSON.
          set +e
          curl --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            -o "${BODY_FILE}" \
            -w 'http_code=%{http_code}\ntime_total=%{time_total}\ntime_connect=%{time_connect}\ntime_starttransfer=%{time_starttransfer}\nsize_download=%{size_download}\n' \
            "${ENDPOINT}" \
            > "${META_FILE}"
          CURL_EXIT=$?
          set -e

          echo "--- curl metrics ---"
          cat "${META_FILE}"
          echo "--- response body ---"
          if [ -s "${BODY_FILE}" ]; then
            # Pretty-print when it parses as JSON; fall back to raw text otherwise.
            if jq . "${BODY_FILE}" 2>/dev/null; then
              :
            else
              cat "${BODY_FILE}"
              echo
            fi
          else
            echo "(empty body)"
          fi
          echo "--- end response ---"

          HTTP_CODE=$(grep '^http_code=' "${META_FILE}" | cut -d= -f2)

          if [ "${CURL_EXIT}" -ne 0 ]; then
            echo "::error::curl exited with ${CURL_EXIT} (network/transport failure before HTTP response)"
            exit "${CURL_EXIT}"
          fi

          if [ -z "${HTTP_CODE}" ] || [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::publish-scheduled returned HTTP ${HTTP_CODE}"
            exit 1
          fi

          # Surface counts at the top of the log so they're visible without
          # expanding the response section. The response body also includes
          # per-post newsletter status when a due or retryable post is found.
          if command -v jq >/dev/null 2>&1 && jq -e . "${BODY_FILE}" >/dev/null 2>&1; then
            DUE=$(jq -r '.due // "?"' "${BODY_FILE}")
            PROCESSED=$(jq -r '.processed // "?"' "${BODY_FILE}")
            FAILED=$(jq -r '.failed // "?"' "${BODY_FILE}")
            echo "Summary: due=${DUE} processed=${PROCESSED} failed=${FAILED}"
          fi
