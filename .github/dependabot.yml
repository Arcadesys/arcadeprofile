version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # typescript-eslint (via eslint-config-next) does not support TS 7 yet;
      # lint crashes on install. Drop this once typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # vite, its React plugin, and vitest pin each other through peer deps,
      # so a lone vite major fails `npm ci` with ERESOLVE. Bump them together.
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "typescript"
          - "tsx"
          - "postcss"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "sass"
        exclude-patterns:
          - "eslint-config-next"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
